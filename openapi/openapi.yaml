components:
  parameters:
    WechatAppid:
      in: header
      name: X-Wechat-Appid
      required: true
      schema: { type: string }
    StoreId:
      in: header
      name: X-Store-Id
      required: true
      schema: { type: string }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      schema: { type: string }
    ID:
      in: path
      name: id
      required: true
      schema: { type: string }
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details: {}
    Ready:
      type: object
      properties:
        status: { type: string }
    Bootstrap:
      type: object
      properties:
        store_id: { type: string }
        store_name: { type: string }
        brand_name: { type: string }
        theme_color: { type: string }
        logo_url: { type: string }
        is_open: { type: boolean }
        announcement: { type: string }
    PublicStore:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        address: { type: string }
        business_hours: { type: string }
        is_open: { type: boolean }
        timezone: { type: string }
    Policies:
      type: object
      properties:
        privacy_policy: { type: string }
        refund_policy: { type: string }
        qualifications: { type: string }
    CartItem:
      type: object
      required: [sku_id, qty]
      properties:
        sku_id: { type: string }
        option_ids:
          type: array
          items: { type: string }
        qty: { type: integer, minimum: 1, maximum: 99 }
    PreviewRequest:
      type: object
      required: [scene, items]
      properties:
        scene: { type: string, enum: [DINE_IN, PICKUP] }
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        table_token: { type: string }
        scheduled_for: { type: string, format: date-time }
        customer_coupon_id: { type: string }
    PreviewResponse:
      type: object
      properties:
        quote_token: { type: string }
        expires_at: { type: string, format: date-time }
        goods_cents: { type: integer, format: int64 }
        packing_cents: { type: integer, format: int64 }
        discount_cents: { type: integer, format: int64 }
        payable_cents: { type: integer, format: int64 }
        pickup_type: { type: string, enum: [IMMEDIATE, SCHEDULED] }
        scheduled_for: { type: string, format: date-time }
    Order:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        payment_status: { type: string }
        pickup_type: { type: string }
        scheduled_for: { type: string, format: date-time }
        pickup_business_date: { type: string }
        pickup_number: { type: string }
        payable_cents: { type: integer, format: int64 }
        version: { type: integer }
    CustomerMenu:
      type: object
      properties:
        categories:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              dishes:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    from_price_cents: { type: integer, format: int64 }
                    sold_out: { type: boolean }
