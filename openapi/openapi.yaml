openapi: 3.0.3
info:
  title: DishFlow API
  version: 1.0.0
  description: 多门店餐饮点餐与履约系统 HTTP 契约（不含 iOS）
servers:
  - url: /
tags:
  - name: health
  - name: customer
  - name: admin
  - name: platform
  - name: callbacks
paths:
  /health/live:
    get:
      tags: [health]
      summary: 存活检查
      responses:
        "200":
          description: ok
  /health/ready:
    get:
      tags: [health]
      summary: 就绪检查
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "503":
          description: not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /media/menu/{path}:
    get:
      tags: [customer]
      summary: 可信菜单图片代理
      parameters:
        - in: path
          name: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: image
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/auth/wechat/session:
    post:
      tags: [customer]
      summary: 微信 code 换顾客会话
      parameters:
        - $ref: "#/components/parameters/WechatAppid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: session
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  customer_id: { type: string }
                  store_id: { type: string }
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/storefront/bootstrap:
    get:
      tags: [customer]
      summary: 门店启动信息
      parameters:
        - $ref: "#/components/parameters/WechatAppid"
      responses:
        "200":
          description: bootstrap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
  /api/v1/store:
    get:
      tags: [customer]
      parameters:
        - $ref: "#/components/parameters/WechatAppid"
      responses:
        "200":
          description: store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStore"
  /api/v1/store/policies:
    get:
      tags: [customer]
      parameters:
        - $ref: "#/components/parameters/WechatAppid"
      responses:
        "200":
          description: policies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policies"
  /api/v1/menu:
    get:
      tags: [customer]
      parameters:
        - $ref: "#/components/parameters/WechatAppid"
      responses:
        "200":
          description: menu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMenu"
  /api/v1/tables/resolve:
    get:
      tags: [customer]
      parameters:
        - $ref: "#/components/parameters/WechatAppid"
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: table
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/pickup-slots:
    get:
      tags: [customer]
      parameters:
        - $ref: "#/components/parameters/WechatAppid"
        - in: query
          name: date
          schema: { type: string, format: date }
      responses:
        "200":
          description: slots
  /api/v1/coupon-offers:
    get:
      tags: [customer]
      parameters:
        - $ref: "#/components/parameters/WechatAppid"
      responses:
        "200":
          description: offers
  /api/v1/pricing/preview:
    post:
      tags: [customer]
      parameters:
        - $ref: "#/components/parameters/WechatAppid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
      responses:
        "200":
          description: quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResponse"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/orders:
    post:
      tags: [customer]
      parameters:
        - $ref: "#/components/parameters/WechatAppid"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_token]
              properties:
                quote_token: { type: string }
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/CartItem"
                remark: { type: string, maxLength: 100 }
      responses:
        "200":
          description: order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    get:
      tags: [customer]
      parameters:
        - $ref: "#/components/parameters/WechatAppid"
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: orders
  /api/v1/orders/{id}:
    get:
